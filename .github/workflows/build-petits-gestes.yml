name: Build APK - Petits gestes du Hetre

on:
  push:
    branches:
      - build-petits-gestes-hetre-20260920
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petits-gestes-android
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Les_petits_gestes_de_mon_Hetre.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Les_petits_gestes_de_mon_Hetre_APK
          path: Les_petits_gestes_de_mon_Hetre.apk
          if-no-files-found: error
          retention-days: 7
