name: Construire APK Petits Gestes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-petits-gestes-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Préparer le fichier
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Les-petits-gestes-de-mon-Hetre.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Les-petits-gestes-de-mon-Hetre-Android
          path: dist/Les-petits-gestes-de-mon-Hetre.apk
          if-no-files-found: error
          retention-days: 30
